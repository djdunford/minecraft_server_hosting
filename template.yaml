#                  - s3:GetObject
#                  - s3:ListBucket
#                Resource:
#                  - !Sub "arn:aws:s3:::${Artefacts}"
#                  - !Sub "arn:aws:s3:::${Artefacts}/*"

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-00a89065114e84516
      KeyName: !Ref KeyPair
#      IamInstanceProfile: !Ref InstanceProfile
      InstanceType: t4g.nano
      SecurityGroupIds:
        - !Ref ServerSecurityGroup
      SubnetId: !Ref PublicSubnet1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 8
            DeleteOnTermination: false
            Encrypted: true

#  InstanceProfile:
#    Type: 'AWS::IAM::InstanceProfile'
#    Properties:
#      Path: /
#      Roles:
#        - !Ref ServerBucketReadRole

  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: PrestashopKeyPair
      PublicKeyMaterial: ssh-rsa  ddunford@UK-RXY2Y22G2X

  LoggingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}-loggingbucket"
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  LoggingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LoggingBucket
      PolicyDocument:
        Statement:
          - Effect: "Allow"
            Action:
              - "s3:GetBucketAcl"
              - "s3:PutBucketAcl"
            Resource: !Sub "arn:aws:s3:::${LoggingBucket}"
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'

#  OriginAccessIdentity:
#    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
#    Properties:
#      CloudFrontOriginAccessIdentityConfig:
#        Comment: !Ref AWS::StackName
#
  RewriteRequestStaticFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-req-static"
      AutoPublish: true
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var uri = request.uri
          if (uri.endsWith('/')) {
              request.uri += '${IndexDocument}';
          } else if (!uri.includes('.')) {
              request.uri += '/${IndexDocument}';
          }
          return request;
        }
      FunctionConfig:
        Comment: !Sub "rewrite all paths to /${IndexDocument}"
        Runtime: cloudfront-js-1.0

  NoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Comment: No caching
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        Name: NoCache
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: none
          EnableAcceptEncodingGzip: false
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  Distribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: EC2Instance
    Properties:
      DistributionConfig:
        Enabled: 'true'
        Comment: !Ref AWS::StackName
        DefaultRootObject: !Ref IndexDocument
        HttpVersion: http2
        CustomErrorResponses:
          - ErrorCachingMinTTL: 86400
            ErrorCode: 403 # object not found in bucket
            ResponseCode: 404
            ResponsePagePath: !Sub "/${ErrorDocument}"
        Origins:
          - DomainName: !GetAtt EC2Instance.PublicDnsName
            Id: root
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
            OriginCustomHeaders:
              - HeaderName: X-Forwarded-Proto
                HeaderValue: https
              - HeaderName: X-Scheme
                HeaderValue: https
              - HeaderName: SSL
                HeaderValue: "on"
        DefaultCacheBehavior:
          Compress: false
          CachedMethods:
            - GET
            - HEAD
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          TargetOriginId: root
          CachePolicyId: !Ref NoCachePolicy
          ViewerProtocolPolicy: https-only
          OriginRequestPolicyId: !Ref DistributionPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RewriteRequestStaticFunction.FunctionMetadata.FunctionARN
        PriceClass: !Ref CloudFrontPriceClass
        Logging:
          Bucket: !Sub "${LoggingBucket}.s3.amazonaws.com"
          IncludeCookies: false
          Prefix: ""
        Aliases:
          - breezingclothing.co.uk
          - www.breezingclothing.co.uk
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:430828578942:certificate/7f6a8e31-3f17-49dd-a6e8-5385c631916e
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  DistributionPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allViewer
        Name: passthrough
        QueryStringsConfig:
          QueryStringBehavior: all

  DistributionMonitoringSubscription:
    Type: AWS::CloudFront::MonitoringSubscription
    Properties:
      DistributionId: !Ref Distribution
      MonitoringSubscription:
        RealtimeMetricsSubscriptionConfig:
          RealtimeMetricsSubscriptionStatus: "Enabled"

  AccessLogsGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Description: !Sub "access-logs-${AWS::StackName}"
        Name: !Sub "access-logs-${AWS::StackName}"

  AccessLogsGlueTable:
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref AccessLogsGlueDatabase
      TableInput:
        Name: 'access-logs'
        Description: 'Gzip logs delivered by Amazon CloudFront partitioned'
        TableType: EXTERNAL_TABLE
        Parameters: { "skip.header.line.count": "2" }
        StorageDescriptor:
          InputFormat: org.apache.hadoop.mapred.TextInputFormat
          OutputFormat: IgnoreKeyTextOutputFormat
          Columns:
            - Name: date
              Type: date
            - Name: time
              Type: string
            - Name: location
              Type: string
            - Name: bytes
              Type: bigint
            - Name: request_ip
              Type: string
            - Name: method
              Type: string
            - Name: host
              Type: string
            - Name: uri
              Type: string
            - Name: status
              Type: int
            - Name: referrer
              Type: string
            - Name: user_agent
              Type: string
            - Name: query_string
              Type: string
            - Name: cookie
              Type: string
            - Name: result_type
              Type: string
            - Name: request_id
              Type: string
            - Name: host_header
              Type: string
            - Name: request_protocol
              Type: string
            - Name: request_bytes
              Type: bigint
            - Name: time_taken
              Type: float
            - Name: xforwarded_for
              Type: string
            - Name: ssl_protocol
              Type: string
            - Name: ssl_cipher
              Type: string
            - Name: response_result_type
              Type: string
            - Name: http_version
              Type: string
            - Name: fle_status
              Type: string
            - Name: fle_encrypted_fields
              Type: int
            - Name: c_port
              Type: int
            - Name: time_to_first_byte
              Type: float
            - Name: x_edge_detailed_result_type
              Type: string
            - Name: sc_content_type
              Type: string
            - Name: sc_content_len
              Type: bigint
            - Name: sc_range_start
              Type: bigint
            - Name: sc_range_end
              Type: bigint
          Location: !Sub "s3://${AWS::StackName}-${AWS::AccountId}-loggingbucket/"
          SerdeInfo:
            Parameters:
              field.delim: "\t"
              serialization.format: "\t"
            SerializationLibrary: org.apache.hadoop.hive.serde2.lazy.LazySimpleSerDe

  AccessLogsAthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Description: !Sub "access-logs-${AWS::StackName}"
      Name: !Sub "access-logs-${AWS::StackName}"
      RecursiveDeleteOption: true
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          EncryptionConfiguration:
            EncryptionOption: "SSE_S3"
          ExpectedBucketOwner: !Ref AWS::AccountId
          OutputLocation: !Sub "s3://${AccessLogsAthenaResultBucket}/"

  AccessLogsAthenaResultBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub "${AWS::StackName}-${AWS::AccountId}-accesslogs"
      AccessControl: Private
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpiryRule
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 1
            Status: Enabled


Outputs:
  VPC:
    Description: A reference to the created VPC
    Value: !Ref VPC

  PublicSubnets:
    Description: A list of the public subnets
    Value: !Join [ ",", [ !Ref PublicSubnet1 ]]

  PrivateSubnets:
    Description: A list of the private subnets
    Value: !Join [ ",", [ !Ref PrivateSubnet1 ]]

  PublicSubnet1:
    Description: A reference to the public subnet in the 1st Availability Zone
    Value: !Ref PublicSubnet1

  PrivateSubnet1:
    Description: A reference to the private subnet in the 1st Availability Zone
    Value: !Ref PrivateSubnet1
